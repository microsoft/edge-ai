---
apiVersion: fabric.ontology/v1
kind: OntologyDefinition
metadata:
  name: ValidStatic
dataSources:
  lakehouse:
    name: TestLakehouse
    tables:
      - name: robot
        format: csv
entityTypes:
  - name: Robot
    key: Id
    displayName: Name
    dataBinding:
      type: static
      source: lakehouse
      table: robot
    properties:
      - name: Id
        type: string
      - name: Name
        type: string
...
