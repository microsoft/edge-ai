apiVersion: fabric.ontology/v1
kind: OntologyDefinition
metadata:
  name: IdentityFixture
  description: Additive identity reconciliation fixture
dataSources:
  lakehouse:
    name: IdentityLakehouse
    tables:
      - name: robot
        format: csv
      - name: robotgroup
        format: csv
      - name: sensor
        format: csv
      - name: robot_robotgroup
        format: csv
      - name: robot_sensor
        format: csv
entityTypes:
  - name: Robot
    key: Id
    displayName: Name
    dataBinding:
      type: static
      source: lakehouse
      table: robot
    properties:
      - name: Id
        type: string
      - name: Name
        type: string
      - name: Status
        type: string
  - name: RobotGroup
    key: Id
    displayName: Name
    dataBinding:
      type: static
      source: lakehouse
      table: robotgroup
    properties:
      - name: Id
        type: string
      - name: Name
        type: string
  - name: Sensor
    key: Id
    displayName: Name
    dataBinding:
      type: static
      source: lakehouse
      table: sensor
    properties:
      - name: Id
        type: string
      - name: Name
        type: string
relationships:
  - name: member
    from: Robot
    to: RobotGroup
    cardinality: many-to-many
    binding:
      table: robot_robotgroup
      fromColumn: FromId
      toColumn: ToId
  - name: monitors
    from: Robot
    to: Sensor
    cardinality: many-to-many
    binding:
      table: robot_sensor
      fromColumn: RobotId
      toColumn: SensorId
