# Mock RTSP cameras for testing media workloads without physical cameras.
# Streams: rtsp://admin:password@mock-rtsp-<name>.mock-cameras.svc.cluster.local:8554/live.sdp/<name>
# The credentials are fixed test values; don't expose these services outside the cluster.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mock-cameras
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-rtsp-pattern
  namespace: mock-cameras
  labels:
    app: mock-rtsp-camera
    camera: pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      camera: pattern
  template:
    metadata:
      labels:
        app: mock-rtsp-camera
        camera: pattern
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rtsp-camera
          image: ullaakut/rtspatt@sha256:ff78ebe83192b0af8a20ab61fc598365e706ad356acb9511f710bb457c3585d4
          args: ["-s", "1920x1080", "-f", "30", "-i", "pattern:smpte", "-r", "/pattern", "-u", "admin", "-p", "password"]
          ports:
            - name: rtsp
              containerPort: 8554
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-rtsp-pattern
  namespace: mock-cameras
  labels:
    app: mock-rtsp-camera
    camera: pattern
spec:
  selector:
    camera: pattern
  ports:
    - name: rtsp
      port: 8554
      targetPort: rtsp
      protocol: TCP
