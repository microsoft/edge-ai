[package]
name = "akri-http-post-connector"
version = "1.0.10"
edition = "2021"

[dependencies]
anyhow = "1.0"
azure_iot_operations_connector = "=2.1.0"
azure_iot_operations_protocol = "=1.1.0"
azure_iot_operations_services = "=1.3.0"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.14.0", features = ["macros", "signal", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["std", "attributes"] }
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "std"] }
url = "2"

[dev-dependencies]
tokio = { version = "1.14.0", features = ["net", "io-util", "test-util"] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace]
resolver = "2"

[profile.release]
strip = true
