apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-edge-inference.fullname" . }}
  namespace: {{ include "ai-edge-inference.namespace" . }}
  labels:
    {{- include "ai-edge-inference.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-edge-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ai-edge-inference.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ai-edge-inference.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "ai-edge-inference.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: AIO_BROKER_HOSTNAME
              value: {{ .Values.mqtt.brokerHostname | quote }}
            - name: AIO_BROKER_TCP_PORT
              value: {{ .Values.mqtt.brokerTcpPort | quote }}
            - name: AIO_TLS_CA_FILE
              value: {{ .Values.mqtt.tlsCaFile | quote }}
            - name: AIO_SAT_FILE
              value: {{ .Values.mqtt.satFile | quote }}
            - name: AIO_MQTT_CLIENT_ID
              value: {{ .Values.mqtt.clientId | quote }}
            - name: MQTT_INPUT_TOPICS
              value: {{ .Values.inference.inputTopics | quote }}
            - name: MQTT_QOS_LEVEL
              value: {{ .Values.mqtt.qosLevel | quote }}
            - name: TOPIC_PREFIX
              value: {{ .Values.inference.topicPrefix | quote }}
            - name: DEVICE_NAME
              value: {{ .Values.inference.deviceName | quote }}
            - name: MODELS_DIRECTORY
              value: /models
            - name: DEFAULT_MODELS
              value: {{ .Values.inference.defaultModels | quote }}
            - name: GLOBAL_CONFIDENCE_THRESHOLD
              value: {{ .Values.inference.globalConfidenceThreshold | quote }}
            - name: ENABLE_GPU
              value: {{ .Values.inference.enableGpu | quote }}
            - name: ENABLE_CUDA
              value: {{ .Values.inference.enableCuda | quote }}
            - name: ENABLE_TENSORRT
              value: {{ .Values.inference.enableTensorRt | quote }}
            - name: SITE_ID
              value: {{ .Values.site.id | quote }}
            - name: FACILITY_NAME
              value: {{ .Values.site.facilityName | quote }}
            - name: SITE
              value: {{ .Values.site.id | quote }}
            - name: FACILITY
              value: {{ .Values.site.facilityName | quote }}
            - name: BUSINESS_UNIT
              value: {{ .Values.site.businessUnit | quote }}
            - name: REGION
              value: {{ .Values.site.region | quote }}
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.service.healthPort | quote }}
            - name: RUST_LOG
              value: info
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startup
              port: health
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          volumeMounts:
            - name: mq-sat
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: trust-bundle
              mountPath: /var/run/certs
              readOnly: true
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: mq-sat
          projected:
            sources:
              - serviceAccountToken:
                  path: mq-sat
                  audience: {{ .Values.volumes.mqSat.audience | quote }}
                  expirationSeconds: {{ .Values.volumes.mqSat.expirationSeconds }}
        - name: trust-bundle
          configMap:
            name: {{ .Values.volumes.trustBundle.configMapName }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "ai-edge-inference.modelClaimName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}