---
replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespace: azure-iot-operations

serviceAccount:
  create: true
  name: ""

inference:
  inputTopics: edge-ai/inference/requests
  topicPrefix: edge-ai
  deviceName: inference-01
  defaultModels: default
  globalConfidenceThreshold: "0.5"
  enableGpu: false
  enableCuda: false
  enableTensorRt: false

site:
  id: edge-site
  facilityName: edge-facility
  businessUnit: operations
  region: local

mqtt:
  brokerHostname: aio-broker.azure-iot-operations
  brokerTcpPort: "18883"
  clientId: ai-edge-inference
  tlsCaFile: /var/run/certs/ca.crt
  satFile: /var/run/secrets/tokens/mq-sat
  qosLevel: "1"

models:
  createClaim: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

volumes:
  mqSat:
    audience: aio-internal
    expirationSeconds: 86400
  trustBundle:
    configMapName: azure-iot-operations-aio-ca-trust-bundle

service:
  type: ClusterIP
  metricsPort: 8080
  healthPort: 8081

resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
