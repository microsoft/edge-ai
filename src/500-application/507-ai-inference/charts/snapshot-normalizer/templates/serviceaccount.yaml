{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "snapshot-normalizer.serviceAccountName" . }}
  namespace: {{ include "snapshot-normalizer.namespace" . }}
  labels:
    {{- include "snapshot-normalizer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
