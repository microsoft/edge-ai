apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snapshot-normalizer.fullname" . }}
  namespace: {{ include "snapshot-normalizer.namespace" . }}
  labels:
    {{- include "snapshot-normalizer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "snapshot-normalizer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "snapshot-normalizer.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "snapshot-normalizer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CAMERA_ID
              value: {{ required "normalizer.cameraId is required" .Values.normalizer.cameraId | quote }}
            - name: DEVICE_NAME
              value: {{ required "normalizer.deviceName is required" .Values.normalizer.deviceName | quote }}
            - name: INPUT_TOPIC
              value: {{ .Values.normalizer.inputTopic | quote }}
            - name: OUTPUT_TOPIC
              value: {{ .Values.normalizer.outputTopic | quote }}
            - name: MAX_JPEG_BYTES
              value: {{ .Values.normalizer.maxJpegBytes | quote }}
            - name: MAX_ENVELOPE_BYTES
              value: {{ .Values.normalizer.maxEnvelopeBytes | quote }}
            - name: DEDUP_CAPACITY
              value: {{ .Values.normalizer.dedupCapacity | quote }}
            - name: AIO_BROKER_HOSTNAME
              value: {{ .Values.mqtt.brokerHostname | quote }}
            - name: AIO_BROKER_TCP_PORT
              value: {{ .Values.mqtt.brokerTcpPort | quote }}
            - name: AIO_TLS_CA_FILE
              value: {{ .Values.mqtt.tlsCaFile | quote }}
            - name: AIO_SAT_FILE
              value: {{ .Values.mqtt.satFile | quote }}
            - name: AIO_MQTT_CLIENT_ID
              value: {{ .Values.mqtt.clientId | quote }}
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: mq-sat
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: trust-bundle
              mountPath: /var/run/certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: mq-sat
          projected:
            sources:
              - serviceAccountToken:
                  path: mq-sat
                  audience: {{ .Values.volumes.mqSat.audience | quote }}
                  expirationSeconds: {{ .Values.volumes.mqSat.expirationSeconds }}
        - name: trust-bundle
          configMap:
            name: {{ .Values.volumes.trustBundle.configMapName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}