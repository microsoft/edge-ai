# The adapter keeps deduplication state in memory and subscribes without a
# shared subscription, so the chart always runs a single replica with the
# Recreate strategy. Run one release per input topic to scale out.

image:
  # Placeholder. Build the image from services/snapshot-normalizer and push it
  # to a registry you own.
  repository: your-registry.azurecr.io/snapshot-normalizer
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespace: azure-iot-operations

serviceAccount:
  # Use a distinct service account per workload trust boundary so broker
  # authorization rules can scope this workload alone.
  create: true
  name: ""
  # Annotations prefixed with aio-broker-auth/ become broker authorization
  # attributes for clients that authenticate with this service account token.
  annotations:
    aio-broker-auth/workload: snapshot-normalizer

normalizer:
  # Opaque, lowercase camera identifier. It becomes the subject attribute and a
  # segment of the default output topic.
  cameraId: camera-01
  deviceName: camera-device-01
  # Topic the media connector snapshot-to-mqtt stream publishes to.
  inputTopic: media/v1/media-connector/camera-01/snapshots
  # Leave empty for edge-ai/v1/snapshot-normalizer/<cameraId>/camera/snapshots,
  # which the component 507 inference service subscribes to by default.
  outputTopic: ""
  eventSource: snapshot-normalizer
  # Optional dataschema reference. Keep it consistent with any data flow source
  # schema that consumes the output topic.
  dataSchema: ""
  maxJpegBytes: 4194304
  maxEnvelopeBytes: 8388608
  dedupCapacity: 1024
  dedupWindowSeconds: 300
  publishAttempts: 3
  countersIntervalSeconds: 60
  logLevel: info

mqtt:
  brokerHostname: aio-broker.azure-iot-operations
  brokerTcpPort: "18883"
  # Each pod connects as <clientIdPrefix>-<pod name>, which is unique per pod.
  clientIdPrefix: snapshot-normalizer
  tlsCaFile: /var/run/certs/ca.crt
  satFile: /var/run/secrets/tokens/mq-sat

volumes:
  mqSat:
    audience: aio-internal
    expirationSeconds: 86400
  trustBundle:
    configMapName: azure-iot-operations-aio-ca-trust-bundle

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
