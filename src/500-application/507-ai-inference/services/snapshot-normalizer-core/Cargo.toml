[package]
name = "snapshot-normalizer-core"
version = "0.1.0"
edition = "2021"
authors = ["Edge AI Team"]
description = "Transport-independent normalization core for camera snapshot payloads"
license = "MIT"

[dependencies]
anyhow = "1.0"
azure_iot_operations_mqtt = "1.0.2"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.14", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# Opt out of the parent workspace: independent crate with its own Cargo.lock
[workspace]
resolver = "2"
