# Docusaurus Tests Workflow
# Reusable workflow for running Docusaurus test suite and build verification.
# Called by pages-deploy.yml before documentation deployment.
name: Docusaurus Tests

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Allow tests to fail without blocking the workflow'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  test:
    name: Test Docusaurus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'docs/docusaurus/package-lock.json'

      - name: Install dependencies
        working-directory: docs/docusaurus
        run: npm ci

      - name: TypeScript typecheck
        working-directory: docs/docusaurus
        run: npm run typecheck

      - name: Run tests
        working-directory: docs/docusaurus
        continue-on-error: ${{ inputs.soft-fail }}
        run: npm test

      - name: Build Docusaurus
        working-directory: docs/docusaurus
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docusaurus-test-results
          path: docs/docusaurus/build
          retention-days: 30
