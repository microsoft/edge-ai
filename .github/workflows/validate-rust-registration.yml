---
name: validate-rust-registration

on:
  pull_request:
    paths:
      - 'src/500-application/**'
      - '.github/workflows/rust-tests.yml'
      - '.github/workflows/validate-rust-registration.yml'
      - 'codecov.yml'
      - 'scripts/Validate-RustCrateRegistration.ps1'
      - 'scripts/tests/Validate-RustCrateRegistration.Tests.ps1'
      - '.github/instructions/rust-crate-registration.instructions.md'
  push:
    branches: [main, dev]
    paths:
      - 'src/500-application/**'
      - '.github/workflows/rust-tests.yml'
      - '.github/workflows/validate-rust-registration.yml'
      - 'codecov.yml'
      - 'scripts/Validate-RustCrateRegistration.ps1'
      - 'scripts/tests/Validate-RustCrateRegistration.Tests.ps1'
      - '.github/instructions/rust-crate-registration.instructions.md'

permissions: {}

jobs:
  validate:
    name: Validate Rust crate registration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validator dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name powershell-yaml -Version '0.4.12' -Repository PSGallery -Scope CurrentUser -TrustRepository
          Install-PSResource -Name Pester -Version '5.7.1' -Repository PSGallery -Scope CurrentUser -TrustRepository

      - name: Run Pester tests for validator
        run: |
          ./scripts/Invoke-Pester.ps1 -CI -Path './scripts/tests/Validate-RustCrateRegistration.Tests.ps1'

      - name: Validate Rust crate registration
        run: |
          ./scripts/Validate-RustCrateRegistration.ps1

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-crate-registration-results
          path: |
            logs/rust-crate-registration-report.json
          if-no-files-found: ignore
          retention-days: 14
