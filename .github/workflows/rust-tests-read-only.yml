---
name: Rust Tests Read Only

on:  # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: src/500-application/501-rust-telemetry/services/receiver
          - crate: src/500-application/501-rust-telemetry/services/sender
          - crate: src/500-application/502-rust-http-connector/services/broker
          - crate: src/500-application/502-rust-http-connector/services/subscriber
          - crate: src/500-application/503-media-capture-service/services/media-capture-service
            system_deps: ffmpeg
          - crate: src/500-application/504-mqtt-otel-trace-exporter/services/mqtt-otel-trace-exporter
          - crate: src/500-application/507-ai-inference/services/ai-edge-inference
          - crate: src/500-application/507-ai-inference/services/ai-edge-inference-crate
          - crate: src/500-application/507-ai-inference/services/snapshot-normalizer-core
          - crate: src/900-tools-utilities/901-video-tools/cli/video-to-gif
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          PROTOC_VERSION="26.1"
          PROTOC_ARCHIVE="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          PROTOC_SHA256="a7be2928c0454f132c599e25b79b7ad1b57663f2337d7f7e468a1d59b98ec1b0"
          PROTOC_DIR="${RUNNER_TEMP}/protoc"
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o "${RUNNER_TEMP}/${PROTOC_ARCHIVE}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ARCHIVE}"
          echo "${PROTOC_SHA256}  ${RUNNER_TEMP}/${PROTOC_ARCHIVE}" | sha256sum --check --strict
          rm -rf "${PROTOC_DIR}"
          unzip -q "${RUNNER_TEMP}/${PROTOC_ARCHIVE}" -d "${PROTOC_DIR}"
          rm "${RUNNER_TEMP}/${PROTOC_ARCHIVE}"
          echo "${PROTOC_DIR}/bin" >> "${GITHUB_PATH}"
          "${PROTOC_DIR}/bin/protoc" --version

      - name: Verify base system build dependencies
        shell: bash
        run: |
          set -euo pipefail
          protoc --version
          pkg-config --version
          clang --version

      - name: Install ffmpeg system libraries
        if: matrix.system_deps == 'ffmpeg'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get \
                 -o Acquire::Retries=2 \
                 -o Acquire::http::Timeout=10 \
                 -o Acquire::https::Timeout=10 \
                 update && \
               sudo apt-get \
                 -o Acquire::Retries=2 \
                 -o Acquire::http::Timeout=10 \
                 -o Acquire::https::Timeout=10 \
                 install -y --no-install-recommends \
                 libavcodec-dev \
                 libavformat-dev \
                 libavfilter-dev \
                 libavdevice-dev \
                 libavutil-dev \
                 libswscale-dev \
                 libswresample-dev \
                 libopencv-dev \
                 libclang-dev; then
              exit 0
            fi
            echo "ffmpeg apt attempt ${attempt} failed; sleeping $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          echo "ffmpeg apt install failed after 3 attempts" >&2
          exit 1

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run Rust tests
        working-directory: ${{ matrix.crate }}
        shell: bash
        run: cargo test --locked

      - name: Install SBOM and vulnerability tools
        shell: bash
        run: |
          set -euo pipefail
          install_tool() {
            local name="$1" archive="$2" checksums="$3" url="$4"
            local temp_dir
            temp_dir="$(mktemp -d)"
            curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
              -o "${temp_dir}/${archive}" "${url}/${archive}"
            curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
              -o "${temp_dir}/checksums.txt" "${url}/${checksums}"
            (cd "${temp_dir}" && grep " ${archive}$" checksums.txt | sha256sum -c -)
            sudo tar -xzf "${temp_dir}/${archive}" -C /usr/local/bin "${name}"
            rm -rf "${temp_dir}"
            "${name}" version
          }

          SYFT_VERSION="v1.17.0"
          SYFT_VER="${SYFT_VERSION#v}"
          install_tool \
            syft \
            "syft_${SYFT_VER}_linux_amd64.tar.gz" \
            "syft_${SYFT_VER}_checksums.txt" \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"

          GRYPE_VERSION="v0.86.1"
          GRYPE_VER="${GRYPE_VERSION#v}"
          install_tool \
            grype \
            "grype_${GRYPE_VER}_linux_amd64.tar.gz" \
            "grype_${GRYPE_VER}_checksums.txt" \
            "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}"

      - name: Generate and scan crate SBOM
        working-directory: ${{ matrix.crate }}
        shell: bash
        run: |
          set -euo pipefail
          syft scan dir:. -o cyclonedx-json=sbom.cdx.json
          grype sbom:./sbom.cdx.json \
            --config "${{ github.workspace }}/.grype.yaml" \
            --fail-on critical
