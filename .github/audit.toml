# cargo-audit allow-list (auto-discovered as .cargo/audit.toml)
#
# Entries cover transitive advisories awaiting upstream dependency fixes. Re-evaluate
# whenever direct dependencies are bumped.

[advisories]
ignore = [
  "RUSTSEC-2024-0384", # instant: unmaintained; pulled by parking_lot 0.11 chain via legacy deps
  "RUSTSEC-2024-0449", # unsafe-libyaml: unmaintained; serde_yaml has no patched release or maintained backend
  "RUSTSEC-2024-0436", # paste: unmaintained; pulled by ONNX / candle stack
  "RUSTSEC-2025-0134", # rustls-pemfile: unmaintained 1.x; pulled by hyper-rustls transitive
  "RUSTSEC-2026-0097", # rand: unsound with custom logger; awaiting upstream release
  "RUSTSEC-2026-0367", # zip: privileged extraction permissions; Candle requires <9; https://github.com/microsoft/edge-ai/issues/901
  "RUSTSEC-2026-0368", # zip: extraction symlinks escape destination; Candle requires <9; https://github.com/microsoft/edge-ai/issues/901
  "RUSTSEC-2026-0369", # zip: extraction chmod follows symlinks; Candle requires <9; https://github.com/microsoft/edge-ai/issues/901
]

[yanked]
enabled = false
