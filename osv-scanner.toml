# OSV-Scanner configuration for lockfiles in the repository root
# (requirements.txt, package-lock.json, Cargo.lock).
#
# OSV-Scanner, including OpenSSF Scorecard's Vulnerabilities check, applies an
# osv-scanner.toml only to lockfiles in the same directory; it does not cascade
# into subdirectories. Each lockfile directory with accepted advisories carries
# its own osv-scanner.toml. The matching OpenVEX statements live in
# security/vex/edge-ai.openvex.json. Re-evaluate whenever direct dependencies
# are bumped.

[[IgnoredVulns]]
id = "PYSEC-2026-3807"
reason = "asteval: sandbox escape via BaseException subclasses; fixed in 1.0.9. checkov (pinned 3.2.531, and every release through 3.4.11) pins asteval==1.0.6. checkov evaluates only repository-controlled Terraform. Revisit when checkov allows asteval>=1.0.9."

