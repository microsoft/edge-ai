---
fail-on-severity: high
ignore:
  # atty crate - LOW severity
  # Justification: Crate is unmaintained but functional with no known exploits.
  # The atty crate is used transitively and does not pose an active security risk.
  # References: GHSA-g98v-hv3f-hcfr, RUSTSEC-2021-0145
  - vulnerability: GHSA-g98v-hv3f-hcfr
  - vulnerability: RUSTSEC-2021-0145

  # rustls-webpki 0.102.8 - MEDIUM severity (transitive Rust crate)
  # Justification: Pulled in by azure_iot_operations_mqtt SDK's private fork of
  # rumqttc 0.24.0-fork.4 → rustls 0.22 → rustls-webpki 0.102.8. Cannot be
  # updated without an upstream AIO SDK release.
  # Reference: GHSA-pwjx-qhcg-rvj4
  - vulnerability: GHSA-pwjx-qhcg-rvj4

  # image-size 2.0.2 - HIGH severity, no fix available
  # Justification: Used transitively by Docusaurus's build-time MDX loader to
  # process repository-controlled images. No patched image-size release exists.
  # References: GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr
  - vulnerability: GHSA-5p2g-fcmc-qvqq
    package:
      type: npm
      name: image-size
  - vulnerability: GHSA-w3rx-r6r6-pgpr
    package:
      type: npm
      name: image-size

  # golang.org/x/crypto/openpgp - no fix available
  # Justification: The deprecated openpgp packages are not imported by the Go
  # modules in this repository, and govulncheck reports no reachable findings.
  # Reference: GO-2026-5932
  - vulnerability: GO-2026-5932
    package:
      type: go-module
      name: golang.org/x/crypto

  # setuptools 79.0.1 - MEDIUM severity, fixed in 83.0.0
  # Justification: colcon-core 0.20.1 requires setuptools <80. The dependency
  # is confined to ROS2 builder stages and processes repository-controlled files.
  # Reference: GHSA-h35f-9h28-mq5c
  - vulnerability: GHSA-h35f-9h28-mq5c
    package:
      type: python
      name: setuptools

  # rand 0.8.5 / 0.9.2 - LOW severity, no fix available
  # Justification: Advisory published after PR #411 opened. Affects transitive `rand`
  # pulled via multiple upstream SDKs (azure_iot_operations_mqtt, candle, etc.).
  # Cannot be remediated without upstream releases. Pre-existing on main; out of scope
  # for PR #411 (Issue #362 PowerShell security-gate naming fix).
  # Reference: GHSA-cq8v-f236-94qc
  - vulnerability: GHSA-cq8v-f236-94qc

  # ffmpeg 8.0.1 bundled in opencv-python-headless 4.13.0.92
  # Justification: No newer opencv-python-headless release available. The ffmpeg
  # binary is statically bundled in the PyPI wheel and cannot be patched independently.
  # Will be resolved when opencv releases a new wheel with ffmpeg >= 8.1.
  # References: CVE-2026-40962 (Critical), CVE-2026-30997 (High), CVE-2026-30998 (High),
  #   CVE-2026-30999 (High), CVE-2025-12343 (Medium), CVE-2025-22921 (Medium),
  #   CVE-2025-69693 (Medium)
  - vulnerability: CVE-2026-40962
    package:
      type: binary
      name: ffmpeg
  - vulnerability: CVE-2026-30997
    package:
      type: binary
      name: ffmpeg
  - vulnerability: CVE-2026-30998
    package:
      type: binary
      name: ffmpeg
  - vulnerability: CVE-2026-30999
    package:
      type: binary
      name: ffmpeg
  - vulnerability: CVE-2025-12343
    package:
      type: binary
      name: ffmpeg
  - vulnerability: CVE-2025-22921
    package:
      type: binary
      name: ffmpeg
  - vulnerability: CVE-2025-69693
    package:
      type: binary
      name: ffmpeg
